<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay</title>

    <link rel="stylesheet" href="../_shared/shared.css">
    <link rel="stylesheet" href="../_shared/gameplay-mappool.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="../_shared/deps/reconnecting-websocket.min.js"></script>
    <script src="../_shared/deps/countUp.js"></script>
    <script src="../_shared/utils.js"></script>
</head>
<body>
    <!-- Video -->
    <video autoplay loop muted>
        <source src="../_shared/assets/background.webm">
    </video>
    
    <!-- Whole Page -->
    <div class="main">
        <!-- Player Names -->
        <div class="player-name player-name-left" id="player-name-left"></div>
        <div class="player-name player-name-right" id="player-name-right"></div>

        <!-- Player Stars -->
        <div class="player-star-container player-star-container-left" id="player-star-container-left"></div>
        <div class="player-star-container player-star-container-right" id="player-star-container-right"></div>

        <!-- Logo -->
        <img class="logo" src="../_shared/assets/logo.png">
        <img class="title-background" src="static/title-bg-overlay-75opac.png">
        <img class="title" id="title" src="static/titles/gf-match.png">

        <!-- Stats box -->
        <div class="stats-container">
            <div class="stats-container-background"></div>
            <div class="now-playing-background" id="now-playing-background"></div>
            <div class="now-playing-title" id="now-playing-title">FUBUKI</div>
            <div class="now-playing-artist" id="now-playing-artist">Shiena Nishizawaaaaaaaaaaaa</div>
            <img class="now-playing-mod" id="now-playing-mod" src="../_shared/assets/mods/nm1.png">
            <div class="now-playing-stats">
                <div class="now-playing-bold now-playing-star-rating" id="now-playing-sr">6.44*</div>
                <div class="now-playing-bpm">bpm: <span class="now-playing-bold" id="now-playing-bpm">180</span></div>
                <div class="now-playing-cs">cs: <span class="now-playing-bold" id="now-playing-cs">4.0</span></div>
                <div>ar: <span class="now-playing-bold" id="now-playing-ar">9.4</span></div>
            </div>
            <div class="now-playing-time-details">
                <div class="now-playing-timeline">
                    <div class="now-playing-timeline-background"></div>
                    <div class="now-playing-timeline-foreground" id="now-playing-timeline-foreground"></div>
                    <div class="now-playing-timeline-circle" id="now-playing-timeline-circle"></div>
                </div>
                <div class="now-playing-timeline-details">
                    <div class="now-playing-current-time" id="now-playing-current-time">0:56</div>
                    <div class="now-playing-end-time" id="now-playing-end-time">4:06</div>
                </div>
            </div>
        </div>

        <!-- Score Display -->
        <div class="score-display">
            <!-- Layers -->
            <img class="score-display-bg-1st-layer" src="static/score-section/stats-bg-1st-lighten.png">
            <img class="score-display-bg-2nd-layer" src="static/score-section/stats-bg-2nd-overlay.png">
            <img class="score-display-bg-3rd-layer" src="static/score-section/stats-bg-3rd-color.png">

            <div id="scores">
                <!-- Profile Pictures-->
                <div class="profile-picture profile-picture-left" id="profile-picture-left"></div>
                <div class="profile-picture profile-picture-right" id="profile-picture-right"></div>

                <!-- UR -->
                <div class="player-ur player-ur-left" id="player-ur-left">140.34UR</div>
                <div class="player-ur player-ur-right" id="player-ur-right">90.23UR</div>

                <!-- PP -->
                <div class="player-pp player-pp-left" id="player-pp-left">234pp</div>
                <div class="player-pp player-pp-right" id="player-pp-right">432pp</div>

                <!-- hit count -->
                <div class="player-hit-count player-hit-count-left"><span class="player-hit-count-100" id="player-hit-count-100-left">30</span> / <span class="player-hit-count-50" id="player-hit-count-50-left">8</span> / <span class="player-hit-count-miss" id="player-hit-count-miss-left">10</span></div>
                <div class="player-hit-count player-hit-count-right"><span class="player-hit-count-100" id="player-hit-count-100-right">15</span> / <span class="player-hit-count-50" id="player-hit-count-50-right">2</span> / <span class="player-hit-count-miss" id="player-hit-count-miss-right">4</span></div>
                
                <!-- acc -->
                <div class="player-accuracy player-accuracy-left" id="player-accuracy-left">92.45%</div>
                <div class="player-accuracy player-accuracy-right" id="player-accuracy-right">96.73%</div>

                <!-- Player Score Bar-->
                <div class="player-score-bar player-score-bar-left" id="player-score-bar-left"></div>
                <div class="player-score-bar player-score-bar-right" id="player-score-bar-right"></div>

                <!-- Player Scores -->
                <div class="player-score player-score-left" id="player-score-left">123,456</div>
                <div class="player-score player-score-right player-score-leading" id="player-score-right">234,567</div>

                <!-- Player Score Differences -->
                <div class="player-score-difference player-score-difference-left" id="player-score-difference-left">-111,111</div>
                <div class="player-score-difference player-score-difference-right" id="player-score-difference-right">-111,111</div>
                
                <!-- Acc Diff --> 
                <div class="accuracy-difference">
                    <span id="accuracy-difference-left">-</span>
                    <span class="accuracy-difference-number" id="accuracy-difference-number">4.28%</span>
                    <span id="accuracy-difference-right">+</span>
                </div>
            </div>

            <!-- Chat Display -->
            <div class="chat-display" id="chat-display"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

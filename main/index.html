<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../_shared/shared.css">
    <link rel="stylesheet" href="../_shared/gameplay-mappool.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <!-- Player Names -->
        <div class="player-name player-name-left" id="player-name-left"></div>
        <div class="player-name player-name-right" id="player-name-right"></div>

        <!-- Player Stars -->
        <div class="player-star-container player-star-container-left" id="player-star-container-left"></div>
        <div class="player-star-container player-star-container-right" id="player-star-container-right"></div>

        <!-- Logo -->
        <img class="logo" src="../_shared/assets/logo.png">
        <img class="title-background" src="static/title-bg-overlay-75opac.png">
        <img class="title" src="static/titles/gf-match.png">

        <!-- Gameplay -->
        <div class="gameplay-barrier"></div>

        <!-- Stats box -->
        <div class="stats-container">
            <div class="stats-container-background"></div>
            <div class="now-playing-background"></div>
            <div class="now-playing-title">FUBUKI</div>
            <div class="now-playing-artist">Shiena Nishizawa</div>
            <img class="now-playing-mod" src="../_shared/assets/mods/nm1.png">
            <div class="now-playing-stats">
                <div class="now-playing-bold now-playing-star-rating">6.44*</div>
                <div class="now-playing-bpm">bpm: <span class="now-playing-bold">180</span></div>
                <div class="now-playing-cs">cs: <span class="now-playing-bold">4.0</span></div>
                <div>ar: <span class="now-playing-bold">9.4</span></div>
            </div>
        </div>
    </div>
</body>
</html>

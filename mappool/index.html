<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappool</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../_shared/shared.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="../_shared/deps/reconnecting-websocket.min.js"></script>
    <script src="../_shared/utils.js"></script>
</head>
<body>
    <!-- Video -->
    <video autoplay loop muted>
        <source src="../_shared/assets/background.webm">
    </video>

    <!-- Main Page -->
    <div class="main">
        <!-- Player Names -->
        <div class="player-name player-name-left" id="player-name-left"></div>
        <div class="player-name player-name-right" id="player-name-right"></div>

        <!-- Player Stars -->
        <div class="player-star-container player-star-container-left" id="player-star-container-left"></div>
        <div class="player-star-container player-star-container-right" id="player-star-container-right"></div>

        <!-- Logo -->
        <img class="logo" src="static/logo.png">
        <img class="round-logo" id="round-logo" src="static/round-logos/ro32.png">

        <!-- Mappool Area -->
        <div class="mappool-section">
            <div class="mod-section">
                <img class="mod-section-background" src="static/mappool-section-background/fiveBG.png">
                <div class="maps-container" id="nm-maps-container"></div>
            </div>
            <div class="mod-section">
                <img class="mod-section-background" src="static/mappool-section-background/threeBG.png">
                <div class="maps-container" id="hd-maps-container"></div>
            </div>
            <div class="mod-section">
                <img class="mod-section-background" src="static/mappool-section-background/threeBG.png">
                <div class="maps-container" id="hr-maps-container"></div>
            </div>
            <div class="mod-section">
                <img class="mod-section-background" src="static/mappool-section-background/threeBG.png">
                <div class="maps-container" id="dt-maps-container"></div>
            </div>
            <div class="mod-section">
                <img class="mod-section-background" src="static/mappool-section-background/singleBG.png">
                <div class="maps-container" id="tb-maps-container"></div>
            </div>
        </div>

        <!-- Chat -->
        <div class="chat-display">
            <img class="chat-display-background" src="static/chat/chat-bg.png">
            <img class="chat-text-image" src="static/chat/chat-text.png">
            <div class="chat-display-container" id="chat-display-container"></div>
        </div>
    </div>

        <!-- Sidebar -->
    <div class="sidebar">
        <section class="sidebar-section">
            <h1>Select Round</h1>
            <select size="8" id="round-name">
                <option value="qualifier">Qualifiers</option>
                <option value="ro64">Round of 64</option>
                <option value="ro32">Round of 32</option>
                <option value="ro16">Round of 16</option>
                <option value="qf">Quarterfinals</option>
                <option value="sf">Semifinals</option>
                <option value="f">Finals</option>
                <option value="gf">Grand Finals</option>
            </select>
            <h1>Select Type of Stream</h1>
            <select size="2" id="match-type">
                <option value="showcase">Showcase</option>
                <option value="match">Match</option>
            </select>
            <button onclick="setIdleTitle()">Apply Settings</button>
        </section>
    </div>

    <script src="index.js"></script>
</body>
</html>

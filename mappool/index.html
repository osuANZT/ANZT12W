<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappool</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <!-- Player Names -->
        <div class="player-name player-name-left" id="player-name-left">Player 1</div>
        <div class="player-name player-name-right" id="player-name-right">Player 2</div>

        <!-- Player Stars -->
        <div class="player-star-container player-star-container-left">
            <div class="player-star player-star-fill"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
        </div>
        <div class="player-star-container player-star-container-right">
            <div class="player-star player-star-fill"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
        </div>

        <!-- Logo -->
        <img class="logo" src="static/logo.png">
        <img class="round-logo" src="static/round-logos/ro32.png">
    </div>

    <script src="index.js"></script>
</body>
</html>

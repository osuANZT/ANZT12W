<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappool</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <!-- Player Names -->
        <div class="player-name player-name-left" id="player-name-left">Player 1</div>
        <div class="player-name player-name-right" id="player-name-right">Player 2</div>

        <!-- Player Stars -->
        <div class="player-star-container player-star-container-left">
            <div class="player-star player-star-fill"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
        </div>
        <div class="player-star-container player-star-container-right">
            <div class="player-star player-star-fill"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
            <div class="player-star player-star-empty"></div>
        </div>

        <!-- Logo -->
        <img class="logo" src="static/logo.png">
        <img class="round-logo" src="static/round-logos/ro32.png">

        <!-- Mappool Area -->
        <div class="mappool-section">
            <div class="mod-section">
                <img class="mod-section-background" src="static/mappool-section-background/fiveBG.png">
                <div class="maps-container">
                    <div class="map-container">
                        <div class="map-container-background map-container-background-nm"></div>
                        <div class="map-background-image"></div>
                        <section class="map-metadata">
                            <div class="map-title">FUBUKI</div>
                            <div class="map-artist">Shiena Nishizawa</div>
                        </section>
                        <img class="map-mod-icon" src="../_shared/assets/mods/nm1.png">
                    </div>
                    <div class="map-container">
                        <div class="map-container-background map-container-background-nm"></div>
                        <div class="map-background-image"></div>
                        <section class="map-metadata">
                            <div class="map-title"></div>
                            <div class="map-artist"></div>
                        </section>
                    </div>
                    <div class="map-container">
                        <div class="map-container-background map-container-background-nm"></div>
                        <div class="map-background-image"></div>
                        <section class="map-metadata">
                            <div class="map-title"></div>
                            <div class="map-artist"></div>
                        </section>
                    </div>
                    <div class="map-container">
                        <div class="map-container-background map-container-background-nm"></div>
                        <div class="map-background-image"></div>
                        <section class="map-metadata">
                            <div class="map-title"></div>
                            <div class="map-artist"></div>
                        </section>
                    </div>
                    <div class="map-container">
                        <div class="map-container-background map-container-background-nm"></div>
                        <div class="map-background-image"></div>
                        <section class="map-metadata">
                            <div class="map-title"></div>
                            <div class="map-artist"></div>
                        </section>
                    </div>
                </div>
            </div>
            <div class="mod-section">
                <img class="mod-section-background" src="static/mappool-section-background/threeBG.png">
                <div class="maps-container">
                    <div class="map-container">
                        <div class="map-container-background map-container-background-hd"></div>
                        <div class="map-background-image"></div>
                        <section class="map-metadata">
                            <div class="map-title">FUBUKI</div>
                            <div class="map-artist">Shiena Nishizawa</div>
                        </section>
                        <img class="map-mod-icon" src="../_shared/assets/mods/nm1.png">
                        <div class="map-overlay"></div>
                        <div class="map-action-container">
                            <img src="static/map-action/blue-ban.png">
                        </div>
                        <div class="map-action-container">
                            <img src="static/map-action/red-pick.png">
                            <img src="static/map-action/red-win.png">
                        </div>
                    </div>
                    <div class="map-container">
                        <div class="map-container-background map-container-background-hd"></div>
                        <div class="map-background-image"></div>
                        <section class="map-metadata">
                            <div class="map-title"></div>
                            <div class="map-artist"></div>
                        </section>
                    </div>
                    <div class="map-container">
                        <div class="map-container-background map-container-background-hd"></div>
                        <div class="map-background-image"></div>
                        <section class="map-metadata">
                            <div class="map-title"></div>
                            <div class="map-artist"></div>
                        </section>
                    </div>
                </div>
            </div>
            <div class="mod-section">
                <!-- <img src="static/mappool-section-background/threeBG.png"> -->
                <div class="maps-container"></div>
            </div>
            <div class="mod-section">
                <!-- <img src="static/mappool-section-background/threeBG.png"> -->
                <div class="maps-container"></div>
            </div>
            <div class="mod-section">
                <!-- <img src="static/mappool-section-background/singleBG.png"> -->
                <div class="maps-container"></div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../_shared//shared.css">
    <link rel="stylesheet" href="../_shared/gameplay-mappool.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../_shared/now-playing-bottom-corner.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="../_shared/deps/reconnecting-websocket.min.js"></script>
    <script src="../_shared/utils.js"></script>
</head>
<body>
    <video autoplay loop muted>
        <source src="../_shared/assets/background.webm">
    </video>
    <div class="main">
        <!-- Title Stuff -->
        <img class="logo" src="../_shared/assets/logo.png">
        <img class="title-background" src="../_shared/assets/title-bg-overlay-75opac.png">
        <img class="title" id="title" src="../_shared/assets/titles/f-match.png">
    
        <!-- Results -->
        <img class="results-bg" src="static/results-bg.png">
        <!-- Player Logos -->
        <div class="player-logo player-logo-left" id="player-logo-left"></div>
        <div class="player-logo player-logo-right" id="player-logo-right"></div>
        <!-- Win Status -->
        <img class="win-status win-status-left" src="static/win-status/LOSER.png">
        <img class="win-status win-status-right" src="static/win-status/WINNER.png">
        <!-- Player Names -->
        <div class="player-name player-name-left" id="player-name-left"></div>
        <div class="player-name player-name-right" id="player-name-right"></div>
        <!-- Average Details -->
        <div class="average-details average-details-left">
            <div class="average-score">Avg. Score: <span class="average-details-number">666,444</span></div>
            <div class="average-acc">Avg. Acc: <span class="average-details-number">95.34%</span></div>
        </div>
        <div class="average-details average-details-right">
            <div class="average-score">Avg. Score: <span class="average-details-number">666,444</span></div>
            <div class="average-acc">Avg. Acc: <span class="average-details-number">95.34%</span></div>
        </div>
        <!-- Scoreline -->
        <div class="scoreline"><span>1</span> - <span>5</span></div>

        <!-- Chat -->
        <div class="chat-display">
            <img class="chat-display-background" src="static/chat/chat-bg.png">
            <img class="chat-text-image" src="static/chat/chat-text.png">
            <div class="chat-display-container" id="chat-display-container"></div>
        </div>

        <!-- Now Playing Section -->
        <img class="now-playing-background" src="static/now-playing-background.png">
        <div class="now-playing-song-background" id="now-playing-song-background"></div>
        <div class="now-playing-metadata now-playing-title" id="now-playing-title">FUBUKI</div>
        <div class="now-playing-metadata now-playing-artist" id="now-playing-artist">Shiena Nishizawa</div>
        <div class="now-playing-time-details">
            <div class="now-playing-timeline">
                <div class="now-playing-timeline-background"></div>
                <div class="now-playing-timeline-foreground" id="now-playing-timeline-foreground"></div>
                <div class="now-playing-timeline-circle" id="now-playing-timeline-circle"></div>
            </div>
            <div class="now-playing-timeline-details">
                <div class="now-playing-current-time" id="now-playing-current-time">0:56</div>
                <div class="now-playing-end-time" id="now-playing-end-time">4:06</div>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
